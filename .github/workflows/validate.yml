name: OSF Validate Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  example:
    name: ${{ matrix.format }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        format: [yaml, osf]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: src/cli/go.mod
          cache-dependency-path: src/cli/go.sum
      - name: Build osf
        working-directory: src/cli
        run: go build -o ../../osf ./cmd/osf
      - name: Validate example/${{ matrix.format }}
        run: ./osf validate example/${{ matrix.format }}
