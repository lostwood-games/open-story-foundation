# golangci-lint config for the osf CLI. CI runs it from src/cli.
version: "2"

linters:
  # standard = errcheck, govet, ineffassign, staticcheck, unused.
  default: standard
  enable:
    - gosec
    - misspell
  settings:
    errcheck:
      exclude-functions:
        # CLI output to stdout/stderr: a failed write has nowhere to be reported.
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        # Closing a file opened only for reading.
        - (*os.File).Close
    gosec:
      excludes:
        - G104 # unhandled errors: errcheck covers this.
        - G301 # osf convert writes project folders the user owns; 0755 is intended.
        - G304 # reading a path from a variable is what a CLI that takes paths does.
        - G703 # same as G304, by taint analysis: osf fmt rewrites the files it is given.
        - G306 # converted project files are meant to be readable; 0644 is intended.
    staticcheck:
      checks:
        - all
        # golangci-lint's defaults: style checks that only fit public libraries.
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        # Optional quick fixes, not defects.
        - -QF1001
  exclusions:
    presets:
      - std-error-handling
    rules:
      # Test setup (WriteFile, MkdirAll) fails the test on the next read anyway.
      - path: _test\.go
        linters: [errcheck]
      # mapping() is only called with key/value pairs, so kv[i+1] is in range.
      - path: internal/yamlio/write\.go
        linters: [gosec]
        text: G602

formatters:
  enable:
    - gofmt
